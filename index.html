<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supabase 테스트</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f5f5f5; }
    .box { background: white; padding: 20px; border-radius: 8px; width: 300px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    input { width: 100%; padding: 8px; margin: 5px 0 10px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    #log { margin-top: 15px; color: red; font-size: 0.85rem; word-break: break-all; }
  </style>
</head>
<body>

<div class="box">
  <h3>🌱 ID 회원가입 테스트</h3>
  
  <label>아이디</label>
  <input type="text" id="username" placeholder="영문/숫자 아이디">

  <label>비밀번호</label>
  <input type="password" id="password" placeholder="6자리 이상">

  <button type="button" onclick="doSignUp()">회원가입 버튼 클릭</button>

  <div id="log"></div>
</div>

<script>
  function printLog(msg, isError = true) {
    const logDiv = document.getElementById('log');
    logDiv.style.color = isError ? 'red' : 'green';
    logDiv.innerText = msg;
  }

  // 1. Supabase 키 설정
  const SUPABASE_URL = 'https://jizublzpkzkgngsabjkq.supabase.co';
  const SUPABASE_ANON_KEY = '여기에_복사한_anon_키를_붙여넣으세요'; // <-- 본인 anon 키로 교체

  let supabase;
  try {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (e) {
    printLog('Supabase 초기화 에러: ' + e.message);
  }

  // 2. 회원가입 함수
  async function doSignUp() {
    printLog('회원가입 요청 중...', false);

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();

    if (!username || !password) {
      printLog('아이디와 비밀번호를 모두 입력하세요.');
      return;
    }

    if (password.length < 6) {
      printLog('비밀번호는 6자리 이상이어야 합니다.');
      return;
    }

    const email = username.toLowerCase() + '@game.com';

    try {
      const { data, error } = await supabase.auth.signUp({
        email: email,
        password: password
      });

      if (error) {
        printLog('Supabase 에러: ' + error.message);
      } else {
        printLog('가입 성공! 유저 ID: ' + data.user.id, false);
      }
    } catch (err) {
      printLog('네트워크/코드 오류: ' + err.message);
    }
  }
</script>

</body>
</html>
