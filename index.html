<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>식물 키우기 방치형 게임</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .game-card {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 320px;
        }
        .stage-display {
            font-size: 5rem;
            margin: 1.5rem 0;
        }
        .stats-box {
            background: #eef7f2;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            text-align: left;
        }
        .stats-box p {
            margin: 0.5rem 0;
            color: #333;
            font-weight: bold;
        }
        .btn {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 0.8rem 1.2rem;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 0.5rem;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #45a049;
        }
        .btn-secondary {
            background-color: #2196f3;
        }
        .btn-secondary:hover {
            background-color: #0b7dda;
        }
    </style>
</head>
<body>

<div class="game-card">
    <h2>🌱 방치형 식물 키우기</h2>
    <div class="stage-display" id="plantEmoji">🌱</div>
    
    <div class="stats-box">
        <p>레벨: <span id="level">1</span></p>
        <p>경험치: <span id="exp">0</span> / <span id="maxExp">100</span></p>
        <p>햇살(재화): <span id="sunlight">0</span></p>
    </div>

    <button class="btn" onclick="waterPlant()">💧 물주기 (+10 EXP)</button>
    <button class="btn btn-secondary" onclick="upgradeSunlight()">☀️ 햇살 생성기 업그레이드 (비용: <span id="upgradeCost">50</span> 햇살)</button>
</div>

<script>
    // 게임 데이터 상태
    let gameState = {
        level: 1,
        exp: 0,
        maxExp: 100,
        sunlight: 0,
        sunlightPerSec: 1,
        upgradeCost: 50
    };

    // 식물 상태 아이콘
    const plantIcons = ['🌱', '🌿', '🪴', '🌳', '🌸'];

    // 물주기 (클릭 동작)
    function waterPlant() {
        gameState.exp += 10;
        checkLevelUp();
        updateUI();
    }

    // 경험치 검사 및 레벨업
    function checkLevelUp() {
        if (gameState.exp >= gameState.maxExp) {
            gameState.exp -= gameState.maxExp;
            gameState.level += 1;
            gameState.maxExp = Math.floor(gameState.maxExp * 1.5);
            gameState.sunlightPerSec += 1;
        }
    }

    // 자동 재화 증가 (방치형 로직)
    setInterval(() => {
        gameState.sunlight += gameState.sunlightPerSec;
        updateUI();
    }, 1000);

    // 업그레이드
    function upgradeSunlight() {
        if (gameState.sunlight >= gameState.upgradeCost) {
            gameState.sunlight -= gameState.upgradeCost;
            gameState.sunlightPerSec += 2;
            gameState.upgradeCost = Math.floor(gameState.upgradeCost * 1.8);
            updateUI();
        }
    }

    // 화면 갱신
    function updateUI() {
        document.getElementById('level').innerText = gameState.level;
        document.getElementById('exp').innerText = gameState.exp;
        document.getElementById('maxExp').innerText = gameState.maxExp;
        document.getElementById('sunlight').innerText = gameState.sunlight;
        document.getElementById('upgradeCost').innerText = gameState.upgradeCost;

        // 레벨에 따른 캐릭터 변화
        const iconIndex = Math.min(Math.floor((gameState.level - 1) / 2), plantIcons.length - 1);
        document.getElementById('plantEmoji').innerText = plantIcons[iconIndex];
    }
</script>

</body>
</html>
